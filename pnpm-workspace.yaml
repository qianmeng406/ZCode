packages:
  - apps/dev-docs
  - packages/*
  - apps/zcode-cli
  - apps/zcode-cli/packages/*
  - apps/zcode-cli/tools/*
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
    - win32  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  cpu-features: true
  edgedriver: true
  electron: true
  electron-winstaller: true
  esbuild: true
  geckodriver: true
  koffi: true
  msw: true
  node-pty: true
  protobufjs: true
  ssh2: true
  unsafe-pointer: true
patchedDependencies:
  "@ai-sdk/anthropic@3.0.81": patches/@ai-sdk__anthropic@3.0.81.patch
  "@ai-sdk/openai-compatible@2.0.60": patches/@ai-sdk__openai-compatible@2.0.60.patch
  "@arms/rum-electron@0.0.3": patches/@arms__rum-electron@0.0.3.patch
  "@radix-ui/react-collapsible@1.1.12": patches/@radix-ui__react-collapsible@1.1.12.patch
  "@radix-ui/react-dismissable-layer@1.1.11": patches/@radix-ui__react-dismissable-layer@1.1.11.patch
  "@radix-ui/react-dropdown-menu@2.1.16": patches/@radix-ui__react-dropdown-menu@2.1.16.patch
  "@radix-ui/react-focus-scope@1.1.7": patches/@radix-ui__react-focus-scope@1.1.7.patch
  "@radix-ui/react-navigation-menu@1.2.14": patches/@radix-ui__react-navigation-menu@1.2.14.patch
  "@radix-ui/react-popper@1.2.8": patches/@radix-ui__react-popper@1.2.8.patch
  "@radix-ui/react-radio-group@1.3.8": patches/@radix-ui__react-radio-group@1.3.8.patch
  "@radix-ui/react-scroll-area@1.2.10": patches/@radix-ui__react-scroll-area@1.2.10.patch
  "@radix-ui/react-select@2.2.6": patches/@radix-ui__react-select@2.2.6.patch
  "@radix-ui/react-slider@1.3.6": patches/@radix-ui__react-slider@1.3.6.patch
  "@radix-ui/react-slot@1.2.3": patches/@radix-ui__react-slot@1.2.3.patch
  "@radix-ui/react-slot@1.2.4": patches/@radix-ui__react-slot@1.2.4.patch
  "@radix-ui/react-switch@1.2.6": patches/@radix-ui__react-switch@1.2.6.patch
  "@radix-ui/react-toast@1.2.15": patches/@radix-ui__react-toast@1.2.15.patch
  "vitest@4.1.7": patches/vitest@4.1.7.patch
  "wdio-electron-service@9.2.1": patches/wdio-electron-service@9.2.1.patch
# pnpm 10 只读取 pnpm-workspace.yaml 里的 overrides；原先放在 package.json 的
# `pnpm.overrides` 会被静默忽略。
overrides:
  react: 19.2.7
  react-dom: 19.2.7
